name: Check File Integrity

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  integrity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify protected files
        run: |
          FAILED=0

          while IFS= read -r line || [ -n "$line" ]; do
            # Skip comments and empty lines
            [[ "$line" =~ ^#.*$ || -z "$line" ]] && continue

            expected_hash=$(echo "$line" | awk '{print $1}')
            filepath=$(echo "$line" | awk '{print $2}')

            if [ ! -f "$filepath" ]; then
              echo "::error::Protected file missing: $filepath"
              FAILED=1
              continue
            fi

            actual_hash=$(sha256sum "$filepath" | awk '{print $1}')
            if [ "$actual_hash" != "$expected_hash" ]; then
              echo "::error file=$filepath::Protected file has been modified: $filepath"
              FAILED=1
            else
              echo "  OK  $filepath"
            fi
          done < .github/protected_checksums.sha256

          if [ $FAILED -ne 0 ]; then
            echo ""
            echo "One or more protected files have been tampered with. Restore them from the template."
            exit 1
          fi

          echo "All protected files are intact."
